 name: Publish to npm

 on:
   release:
     types: [published]
   workflow_dispatch:
     inputs:
       version:
         description: 'Version bump type'
         required: true
         default: 'patch'
         type: choice
         options:
           - patch
           - minor
           - major

 jobs:
   publish:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4

       - uses: actions/setup-node@v4
         with:
           node-version: '22'
           registry-url: 'https://registry.npmjs.org'

       - name: Install dependencies
         run: npm install

       - name: Type check
         run: npm run typecheck

       - name: Test
         run: npm test

       - name: Build
         run: npm run build

       - name: Publish to npm
         run: npm publish --access public
         env:
           NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
